# ============================================================================
# 🛡️ MX51 CENTRALISED SECURITY TEMPLATE: CodeQL
# ============================================================================
# Description:
#   Reusable workflow for running GitHub CodeQL advanced security scans.
#   Automatically detects repository languages and executes analysis.
#
# Requirements:
#   - The caller workflow MUST include `secrets: inherit` to allow Gradle 
#     to access private packages and keystore credentials during manual builds.
#
# Inputs:
#   - build_command (optional): Custom build command to bypass Autobuild for 
#     complex monorepos. Only executes for the Java/Kotlin matrix job.
#   - runner_size (optional): The machine type to run the analysis on 
#     (e.g., 'ubuntu-latest-4core' for heavy builds). Defaults to 'ubuntu-latest'.
# ============================================================================
name: "CodeQL"

on:
  workflow_call:
    inputs:
      build_command:
        description: "Optional custom build command to bypass Autobuild for complex monorepos."
        required: false
        type: string
      runner_size:
        description: "The machine type to run the analysis on. Defaults to standard 2-core."
        required: false
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '30 22 * * 2'
  workflow_dispatch:

jobs:
  create-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.languages }}
    steps:
      - name: Get languages from repo
        id: set-matrix
        uses: advanced-security/set-codeql-language-matrix@v1
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          endpoint: ${{ github.event.repository.languages_url }}

  analyze:
    needs: create-matrix
    if: ${{ needs.create-matrix.outputs.matrix != '[]' }}
    name: Analyze
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || inputs.runner_size || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.create-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql-config.yml
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: ${{ inputs.build_command == '' }}
        uses: github/codeql-action/autobuild@v4

      - name: Manual Build
        if: ${{ inputs.build_command != '' && matrix.language == 'java' }}
        run: ${{ inputs.build_command }}
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.BANKOBOT_PAT_GITHUB_PACKAGES }}
          MVN_SSMPOSSDK_VIEWER_USERNAME: ${{ secrets.MVN_SSMPOSSDK_VIEWER_USERNAME }}
          MVN_SSMPOSSDK_VIEWER_PASSWORD: ${{ secrets.MVN_SSMPOSSDK_VIEWER_PASSWORD }}
          KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_DEBUG_PASSWORD }}
          KEYSTORE_COMMONWEALTHBANK_PASSWORD: ${{ secrets.KEYSTORE_COMMONWEALTHBANK_PASSWORD }}
          KEYSTORE_GECKOBANK_PASSWORD: ${{ secrets.KEYSTORE_GECKOBANK_PASSWORD }}
          KEYSTORE_NEXTPAYMENTS_PASSWORD: ${{ secrets.KEYSTORE_NEXTPAYMENTS_PASSWORD }}
          KEYSTORE_TILLPAYMENTS_PASSWORD: ${{ secrets.KEYSTORE_TILLPAYMENTS_PASSWORD }}
          KEYSTORE_WESTPAC_PASSWORD: ${{ secrets.KEYSTORE_WESTPAC_PASSWORD }}
          KEYSTORE_FISERV_PASSWORD: ${{ secrets.KEYSTORE_FISERV_PASSWORD }}
          KEYSTORE_POSPAY_PASSWORD: ${{ secrets.KEYSTORE_POSPAY_PASSWORD }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
